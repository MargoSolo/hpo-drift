[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo-drift"
version = "0.1.1"
description = "Diff two Human Phenotype Ontology releases *for your own term list*: renames, obsoletions, parent changes, and how semantic-similarity scores drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Margarita Soloshenko", email = "msoloshenk@gmail.com"}]
keywords = ["HPO", "Human Phenotype Ontology", "ontology", "semantic similarity", "reproducibility", "phenotype"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = ["obonet>=1.0", "networkx>=3.0", "requests>=2.31"]

[project.scripts]
hpo-drift = "hpo_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/MargoSolo/hpo-drift"
Documentation = "https://margosolo.github.io/hpo-drift/"
Changelog = "https://github.com/MargoSolo/hpo-drift/blob/main/CHANGELOG.md"

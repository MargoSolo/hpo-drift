[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo-drift"
version = "0.1.0"
description = "Diff two Human Phenotype Ontology releases *for your own term list*: renames, obsoletions, parent changes, and how semantic-similarity scores drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Margarita Solosenko"}]
dependencies = ["obonet>=1.0", "networkx>=3.0", "requests>=2.31"]
keywords = ["HPO", "ontology", "phenotype", "reproducibility", "semantic-similarity"]

[project.scripts]
hpo-drift = "hpo_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
